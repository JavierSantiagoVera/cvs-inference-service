[project]
name = "cvs-serve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=1.26",
    "pillow>=10.0",
    "onnxruntime>=1.20",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27"]
# Carga de checkpoints y export a ONNX. La imagen de producción no lo necesita.
torch = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.24,<1.1",
    "safetensors>=0.7",
    "onnx>=1.17",
    "onnxscript>=0.2",
]

[tool.uv]
default-groups = ["dev", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
